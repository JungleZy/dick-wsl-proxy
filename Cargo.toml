[workspace]
members = ["desktop"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
publish = false

[workspace.dependencies]
serde_json = "1"

[package]
name = "wsl-proxyctl"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization"] }
