# Builds, checks and packages the Windows release on a v* tag, then publishes
# a GitHub release with detailed notes. Run it by hand (workflow_dispatch) for a
# dry run: everything but the publish step, with the package kept as an
# artifact. See docs/plans/m5/README.md, "发布流水线".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, check and package (Windows, MSVC)
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: never
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Package the repository's own bytes: no CRLF conversion of scripts,
      # Cargo.lock or the guest scripts embedded in the backend.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # The notes list every commit since the previous v* tag.
          fetch-depth: 0

      # Fetch the tags again so an annotated tag keeps its message (the notes
      # start with it) whatever the checkout made of the triggering tag.
      - name: Fetch annotated tags
        run: git fetch --force --tags origin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and check the version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A RUSTFLAGS variable, even an empty one, replaces the +crt-static
          # setting in .cargo/config.toml and would link the C runtime dynamically.
          if (Test-Path Env:RUSTFLAGS) { throw 'RUSTFLAGS is set; unset it for release builds' }
          $line = Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"$' | Select-Object -First 1
          if (-not $line) { throw 'No workspace version in Cargo.toml' }
          $version = $line.Matches[0].Groups[1].Value
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") {
            throw "Tag $env:REF_NAME does not match the workspace version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory ci-logs, work, dist | Out-Null

      - name: Install the Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc -vV | Out-File -Encoding utf8 work/toolchain.txt
          cargo -V | Out-File -Encoding utf8 -Append work/toolchain.txt
          python --version | Out-File -Encoding utf8 -Append work/toolchain.txt
          Get-Content work/toolchain.txt

      - name: Format and lint
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit 1 }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit 1 }

      - name: Rust tests (controller and desktop)
        shell: pwsh
        run: |
          cargo test --locked --workspace 2>&1 | Tee-Object -FilePath ci-logs/cargo-test.txt
          if ($LASTEXITCODE) { exit 1 }

      - name: Guest script tests
        shell: pwsh
        run: |
          foreach ($test in 'test_kernel.py', 'test_https_probe.py', 'test_kernel_env.py') {
            python "src/guest/$test" 2>&1 | Tee-Object -FilePath ci-logs/python-guest.txt -Append
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: Packaging script tests
        shell: pwsh
        run: |
          python scripts/test_package_windows.py 2>&1 | Tee-Object -FilePath ci-logs/python-packaging.txt
          if ($LASTEXITCODE) { exit 1 }

      - name: Build the release executables
        shell: pwsh
        run: |
          cargo build --locked --release -p wsl-proxyctl -p wsl-proxy-desktop
          if ($LASTEXITCODE) { exit 1 }
          $reported = (& target/release/wsl-proxyctl.exe --version | Out-String).Trim()
          if ($reported -cne 'wsl-proxyctl ${{ steps.version.outputs.version }}') { throw "Backend reports '$reported'" }

      - name: Refuse a dynamically linked C runtime
        shell: pwsh
        run: |
          python scripts/check-windows-imports.py --json work/imports.json target/release/wsl-proxyctl.exe target/release/wsl-proxy-desktop.exe
          if ($LASTEXITCODE) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          cargo metadata --locked --format-version 1 > work/cargo-metadata.json
          if ($LASTEXITCODE) { exit 1 }
          python scripts/build-record.py --version $version --backend target/release/wsl-proxyctl.exe --desktop target/release/wsl-proxy-desktop.exe --output work/build-record.json
          if ($LASTEXITCODE) { exit 1 }
          python scripts/package-windows.py --backend target/release/wsl-proxyctl.exe --desktop target/release/wsl-proxy-desktop.exe --version $version --build-record work/build-record.json --cargo-metadata work/cargo-metadata.json --output-dir dist
          if ($LASTEXITCODE) { exit 1 }

      - name: Install smoke test
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          & powershell.exe -NoProfile -File scripts/smoke-install-windows.ps1 -Zip "dist/wsl-proxy-$version-windows-x64.zip" -Version $version -WorkDir "$env:RUNNER_TEMP\wsl-proxy-smoke" -Output work/smoke.json
          if ($LASTEXITCODE) { exit 1 }

      - name: Release notes
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { 'HEAD' }
          python scripts/release-notes.py --version $version --tag $tag --zip "dist/wsl-proxy-$version-windows-x64.zip" --imports work/imports.json --smoke work/smoke.json --logs ci-logs --toolchain work/toolchain.txt --output work/release-notes.md
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item work/release-notes.md dist/
          Get-Content work/release-notes.md >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: wsl-proxy-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*
            work/build-record.json
            work/imports.json
            work/smoke.json
            ci-logs/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.package.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wsl-proxy-${{ needs.package.outputs.version }}-windows-x64
          path: artifact

      # Published as a pre-release: the package is unsigned and its
      # third-party licenses are still under review (docs/plans/m5/README.md).
      - name: Create the release
        run: |
          gh release create "$TAG" \
            "artifact/dist/wsl-proxy-$VERSION-windows-x64.zip" \
            "artifact/dist/wsl-proxy-$VERSION-windows-x64.zip.sha256" \
            --verify-tag \
            --prerelease \
            --title "WSL Proxy $VERSION" \
            --notes-file artifact/dist/release-notes.md
